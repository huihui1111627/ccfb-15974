<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>机房温度预测与空调联动</title>
<style>
  :root{--bg:#0e1117;--panel:#161b22;--line:#30363d;--txt:#e6edf3;--dim:#8b949e;
        --ok:#3fb950;--warn:#d29922;--crit:#f85149;--cold:#58a6ff}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,"PingFang SC","Microsoft YaHei",sans-serif}
  header{display:flex;align-items:center;gap:16px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel)}
  header h1{font-size:15px;margin:0;font-weight:600}
  header .sub{color:var(--dim);font-size:12px}
  .wrap{display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto auto;gap:14px;padding:14px;max-width:1500px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
  .card h2{font-size:13px;margin:0 0 10px;font-weight:600;color:var(--txt)}
  .plan{grid-column:1}
  .side{grid-column:2;grid-row:1/span 2}
  .bottom{grid-column:1}
  .placement{grid-column:1/span 2}
  canvas{width:100%;display:block;border-radius:6px}
  .legend{display:flex;align-items:center;gap:8px;margin-top:8px;color:var(--dim);font-size:11px}
  .grad{height:10px;flex:1;border-radius:4px;background:linear-gradient(90deg,#2c7bb6,#00a6ca,#00ccbc,#90eb9d,#ffff8c,#f9d057,#f29e2e,#e76818,#d7191c)}
  table{width:100%;border-collapse:collapse;font-size:12px}
  th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line)}
  th{color:var(--dim);font-weight:500}
  .pill{display:inline-block;padding:1px 7px;border-radius:9px;font-size:11px}
  .p-on{background:#12341f;color:var(--ok)} .p-off{background:#3a1a1a;color:var(--crit)}
  .p-warn{background:#3a2f12;color:var(--warn)}
  .bar{height:6px;border-radius:3px;background:#21262d;overflow:hidden;margin-top:3px}
  .bar>i{display:block;height:100%;background:var(--cold)}
  .ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  select,button{background:#21262d;color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12px}
  input[type=range]{flex:1;min-width:140px}
  .stat{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}
  .stat b{font-weight:600}
  .alerts{max-height:280px;overflow:auto}
  .alert{display:flex;justify-content:space-between;gap:8px;padding:6px;border-radius:6px;margin-bottom:5px;font-size:12px}
  .a-crit{background:#2a1414;border-left:3px solid var(--crit)}
  .a-warn{background:#2a2414;border-left:3px solid var(--warn)}
  .mono{font-variant-numeric:tabular-nums}
  .tabs{display:flex;gap:8px}
  .tabs button.active{background:#1f6feb;border-color:#1f6feb}
</style>
</head>
<body>
<header>
  <h1>机房温度预测与空调联动调节</h1>
  <div class="sub" id="sub">—</div>
  <div style="margin-left:auto" class="tabs" id="runTabs"></div>
</header>
<div class="wrap">
  <div class="card plan">
    <h2>机房平面温度热力图 (机柜进风)</h2>
    <canvas id="plan" height="440"></canvas>
    <div class="legend"><span>18°C</span><div class="grad"></div><span>32°C</span>
      <span style="margin-left:10px">■ 机柜位 &nbsp; ▭ 空调</span></div>
    <div class="ctl">
      <span id="clock" class="mono" style="min-width:210px"></span>
      <input type="range" id="time" min="0" max="100" value="0">
      <button id="play">▶ 播放</button>
      <select id="speed"><option value="4">4×</option><option value="16" selected>16×</option><option value="64">64×</option></select>
    </div>
  </div>

  <div class="card side">
    <h2>空调状态</h2>
    <table id="crah"><thead><tr><th>机组</th><th>设定</th><th>风量</th><th>出力</th><th>状态</th></tr></thead><tbody></tbody></table>
    <div id="crapsum" style="margin-top:10px"></div>
  </div>

  <div class="card bottom">
    <h2>热点预测与告警</h2>
    <div class="alerts" id="alerts"></div>
    <div id="stats" style="margin-top:10px;border-top:1px solid var(--line);padding-top:8px"></div>
    <div id="summary" style="margin-top:8px"></div>
  </div>

  <div class="card placement">
    <h2>新服务器上架位置建议 <span class="sub" id="plsub"></span></h2>
    <canvas id="place" height="230"></canvas>
    <div id="pltable" style="margin-top:8px"></div>
  </div>
</div>
<script>
const $=s=>document.querySelector(s);
let run=null, plan=null, tIdx=0, timer=null;

function fmtTime(s){const d=Math.floor(s/86400)+1,h=Math.floor((s%86400)/3600),m=Math.floor((s%3600)/60);
  return `第 ${d} 天 ${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`;}

async function loadRuns(){
  const runs=await (await fetch('/api/runs')).json();
  const tabs=$('#runTabs'); tabs.innerHTML='';
  const names={fixed:'固定最大',lp:'最热点统一',predictive:'联动优化',lp_fault:'统一+故障',predictive_fault:'联动+故障'};
  runs.forEach((r,i)=>{const b=document.createElement('button');b.textContent=names[r]||r;b.onclick=()=>selectRun(r);
    if(i===0)b.classList.add('active');b.dataset.r=r;tabs.appendChild(b);});
  if(runs.length) selectRun(runs.includes('predictive')?'predictive':runs[0]);
}
async function selectRun(tag){
  [...$('#runTabs').children].forEach(b=>b.classList.toggle('active',b.dataset.r===tag));
  const r=await (await fetch('/api/run/'+tag)).json();
  run=r; plan=null; tIdx=0; $('#time').max=r.times.length-1; $('#time').value=0;
  const tab=document.querySelector('[data-r="'+tag+'"]');
  $('#sub').textContent=(tab?tab.textContent:tag)+' · '+fmtTime(r.times[0])+' — '+fmtTime(r.times[r.times.length-1]);
  const sp=+$('#speed').value;
  draw(); renderSide(); renderAlerts();
}

// 温度->颜色 (18..32)
const STOPS=[[18,44,123,182],[20,0,166,202],[22,0,204,188],[24,144,235,157],[26,255,255,140],[28,249,208,87],[30,242,158,46],[32,215,25,28]];
function colorFor(t){
  if(t<=STOPS[0][0])return `rgb(${STOPS[0].slice(1)})`;
  if(t>=STOPS[STOPS.length-1][0])return `rgb(${STOPS[STOPS.length-1].slice(1)})`;
  for(let i=0;i<STOPS.length-1;i++){if(t>=STOPS[i][0]&&t<=STOPS[i+1][0]){const a=(t-STOPS[i][0])/(STOPS[i+1][0]-STOPS[i][0]);
    const c=[0,1,2,3].map(k=>Math.round(STOPS[i][k+1]+(STOPS[i+1][k+1]-STOPS[i][k+1])*a));
    return `rgb(${c[0]},${c[1]},${c[2]})`;}}
}

function buildPlan(){
  const r=run,NX=r.nx,NY=r.ny;
  // 把每个 cell 的 (i,j,T) 铺成网格
  const grid=Array.from({length:NY},()=>Array(NX).fill(null));
  plan={grid,NX,NY};
}
function draw(){
  if(!run)return;
  if(!plan)buildPlan();
  const c=$('#plan'), ctx=c.getContext('2d');
  const dpr=window.devicePixelRatio||1;
  const W=c.clientWidth, H=440;
  c.width=W*dpr; c.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,W,H);
  const r=run, NX=r.nx, NY=r.ny;
  const pad=10, cw=(W-2*pad)/NX, ch=(H-2*pad)/NY;
  const frame=r.frames[tIdx];
  // 填底
  ctx.fillStyle='#0b0f14'; ctx.fillRect(pad,pad,W-2*pad,H-2*pad);
  // 按网格类型着色
  for(let k=0;k<frame.length;k++){
    const i=r.cell_i[k], j=r.cell_j[k], t=frame[k], ty=r.cell_type[k];
    const x=pad+i*cw, y=pad+(NY-1-j)*ch;
    ctx.fillStyle=colorFor(t);
    ctx.fillRect(x,y,cw+0.5,ch+0.5);
  }
  // 机柜位: 用进风温度填色(操作员最关心进风温度)
  const inl=r.inlet[tIdx];
  for(let n=0;n<r.rack_labels.length;n++){
    const lab=r.rack_labels[n];
    const j=ROWJ[lab[0]];
    const x=pad+lab[1]*cw, y=pad+(NY-1-j)*ch;
    ctx.fillStyle=colorFor(inl[n]);
    ctx.fillRect(x,y,cw+0.5,ch+0.5);
    ctx.strokeStyle='rgba(230,237,243,.25)'; ctx.lineWidth=0.5; ctx.strokeRect(x,y,cw,ch);
    if(inl[n]>27){ctx.strokeStyle='#f85149';ctx.lineWidth=1.5;ctx.strokeRect(x,y,cw,ch);}
    else if(inl[n]>25){ctx.strokeStyle='#d29922';ctx.lineWidth=1.1;ctx.strokeRect(x,y,cw,ch);}
  }
  // 空调(状态来自最近一次指令)
  const cmd0=currentCmd(r,r.times[tIdx]);
  const onArr=cmd0?cmd0.on:[true,true,true,true,true,true,true];
  for(let ci=0;ci<CRAHS.length;ci++){
    const cr=CRAHS[ci];
    const x=pad+cr.x*cw, y=pad+(NY-1-cr.y)*ch;
    ctx.fillStyle=onArr[ci]?'#1f6feb':'#30363d';
    ctx.beginPath();ctx.arc(x,y,Math.min(cw*1.6,10),0,7);ctx.fill();
    ctx.fillStyle='#e6edf3';ctx.font='10px sans-serif';ctx.textAlign='center';
    ctx.fillText(cr.name,x,y-Math.min(cw*1.6,10)-3);
  }
  // 时钟
  $('#clock').textContent=fmtTime(r.times[tIdx]);
}
const ROWJ={R1:2,R2:4,R3:6,R4:8,R5:10,R6:12,R7:14,R8:16,R9:18,R10:20};
const CRAHS=[{name:'S1',x:6,y:0.5},{name:'S2',x:16,y:0.5},{name:'S3',x:26,y:0.5},{name:'S4',x:36,y:0.5},
  {name:'N1',x:11,y:22.5},{name:'N2',x:21,y:22.5},{name:'N3',x:31,y:22.5}];
// 依据当前时间的 cmd_log 最近一条, 更新空调状态
function currentCmd(r,t){
  let cmd=null; for(const [ct,c] of r.cmd_log){ if(ct<=t) cmd=c; else break; }
  return cmd;
}
function renderSide(){
  const r=run; if(!r)return; const t=r.times[tIdx]; const cmd=currentCmd(r,t);
  const tb=$('#crah').querySelector('tbody'); tb.innerHTML='';
  const names=['S1','S2','S3','S4','N1','N2','N3'];
  let totQ=0,totV=0;
  if(cmd){
    for(let k=0;k<names.length;k++){
      const on=cmd.on[k], ts=cmd.tset[k], vf=cmd.vfrac[k];
      const v=vf*5.5; totV+=on?v:0;
      const q=on?Math.min(100,1.206*v*Math.max(0,(28-ts))):0; totQ+=q;
      const tr=document.createElement('tr');
      tr.innerHTML=`<td><b>${names[k]}</b></td><td class="mono">${on?ts.toFixed(1):'—'}</td>
        <td class="mono">${on?v.toFixed(1):'0'} m³/s</td>
        <td class="mono">${on?q.toFixed(0):'0'} kW</td>
        <td>${on?'<span class="pill p-on">运行</span>':'<span class="pill p-off">停止</span>'}</td>`;
      tb.appendChild(tr);
    }
  }
  $('#crapsum').innerHTML=`<div class="stat"><span>总风量</span><b class="mono">${totV.toFixed(1)} m³/s</b></div>
    <div class="stat"><span>估算制冷量</span><b class="mono">${totQ.toFixed(0)} kW</b></div>`;
}
function renderAlerts(){
  const r=run; if(!r)return; const t=r.times[tIdx];
  // 最近的预测告警(时间<=t)
  let al=null, alT=0;
  for(const [at,a,pm] of r.alerts){ if(at<=t){al=a;alT=at;} else break; }
  const box=$('#alerts'); box.innerHTML='';
  const inl=r.inlet[tIdx];
  let nowMax=0,nowOver=0;
  for(let n=0;n<inl.length;n++){nowMax=Math.max(nowMax,inl[n]);if(inl[n]>27)nowOver++;}
  // 实测当前告警
  if(nowOver>0){
    const d=document.createElement('div');d.className='alert a-crit';
    d.innerHTML=`<span>⚠ 当前实测 ${nowOver} 个机柜进风 &gt;27°C</span><b class="mono">${nowMax.toFixed(1)}°C</b>`;
    box.appendChild(d);
  }
  if(al&&al.length){
    for(const a of al.slice(0,8)){
      const d=document.createElement('div');
      d.className='alert '+(a.crit?'a-crit':'a-warn');
      const lead=a.lead_min!=null?`预计 ${a.lead_min.toFixed(0)} 分钟内超限`:'接近上限';
      d.innerHTML=`<span>${a.rack.join('-')} · ${lead}</span><b class="mono">${a.peak.toFixed(1)}°C</b>`;
      box.appendChild(d);
    }
  } else if(nowOver===0){
    box.innerHTML='<div style="color:var(--dim);padding:8px">无热点告警 · 所有机柜进风温度正常</div>';
  }
  // 统计
  const overFrac=r.over_mask[tIdx].reduce((a,b)=>a+b,0);
  $('#stats').innerHTML=`<div class="stat"><span>预测告警(未来30min)</span><b>${al?al.filter(a=>a.crit).length:0} 个临界</b></div>
    <div class="stat"><span>能耗(采样点)</span><b class="mono">${r.energy_seq[tIdx].toFixed(0)} kW</b></div>
    <div class="stat"><span>本帧超温机柜</span><b class="mono">${overFrac}</b></div>`;
}
$('#time').oninput=e=>{tIdx=+e.target.value;draw();renderSide();renderAlerts();};
$('#play').onclick=()=>{
  if(timer){clearInterval(timer);timer=null;$('#play').textContent='▶ 播放';return;}
  $('#play').textContent='⏸ 暂停';
  const sp=+$('#speed').value;
  timer=setInterval(()=>{tIdx=(tIdx+1)%run.times.length;$('#time').value=tIdx;draw();renderSide();renderAlerts();},1000/sp);
};
window.addEventListener('resize',draw);
loadRuns();

// ---------------- 汇总对比 + 上架建议 ----------------
async function loadSummary(){
  let s=null;
  try{ s=await (await fetch('/api/summary')).json(); }catch(e){ return; }
  if(!s||!s.policies)return;
  const P=s.policies, names={fixed:'固定最大',lp:'最热点统一',predictive:'联动优化'};
  const base=P.fixed?P.fixed.energy_kwh:null;
  let rows='';
  for(const pol of ['fixed','lp','predictive']){
    const m=P[pol]; if(!m)continue;
    const save=base?((1-m.energy_kwh/base)*100):0;
    rows+=`<tr><td>${names[pol]}</td><td class="mono">${(m.energy_kwh/m.days).toFixed(0)}</td>
      <td class="mono ${save>0?'':''}">${save>0?'-':''}${save.toFixed(1)}%</td>
      <td class="mono">${m.peak_inlet.toFixed(1)}</td>
      <td class="mono">${m.over_minutes_any.toFixed(0)}</td>
      <td class="mono">${m.over_rack_count}</td></tr>`;
  }
  let ft='';
  if(s.fault_test){
    const f=s.fault_test;
    ft=`<div class="stat" style="margin-top:6px"><span>故障测试(${f.fault_crah},第${f.fault_day}天${f.fault_hour}:00 关6h)</span></div>
      <div class="stat"><span>预测首个超温</span><b class="mono">${f.predicted_lead_min==null?'—':f.predicted_lead_min+' min'}</b></div>
      <div class="stat"><span>仿真实际首个超温</span><b class="mono">${f.actual_first_over_min==null?'—':f.actual_first_over_min+' min'}</b></div>
      <div class="stat"><span>预测误差</span><b class="mono">${f.lead_error_min==null?'—':(f.lead_error_min>0?'+':'')+f.lead_error_min+' min'}</b></div>
      <div class="stat"><span>故障期峰值(预测/实际)</span><b class="mono">${f.predicted_peak??'—'} / ${f.actual_peak??'—'} °C</b></div>`;
  }
  $('#summary').innerHTML=`<div style="border-top:1px solid var(--line);padding-top:8px">
    <div class="stat"><span style="font-weight:600">一个月对比(日均能耗 kWh / 相对固定出力 / 峰值°C / 超温min / 超温柜数)</span></div>
    <table><thead><tr><th>策略</th><th>日均kWh</th><th>节能</th><th>峰值</th><th>超温min</th><th>柜</th></tr></thead>
    <tbody>${rows}</tbody></table>${ft}
    <div class="stat" style="color:var(--dim)"><span>室外最高 ${s.load?.t_out_max}°C · 负载峰值 ${s.load?.peak_kw}kW · ${s.config?.n_crah}台空调</span></div>
    </div>`;
}
async function loadPlacement(){
  let p=null;
  try{ p=await (await fetch('/api/placement')).json(); }catch(e){ return; }
  if(!p)return;
  $('#plsub').textContent=`(典型高负载 ${p.day}日${p.hour}:00, 室外${p.t_out}°C, 负载${p.load_kw}kW; 放入一台 ${p.new_kw}kW 服务器)`;
  // 画虚线框标出候选空位, 颜色按排名
  const c=$('#place'), ctx=c.getContext('2d');
  const dpr=window.devicePixelRatio||1; const W=c.clientWidth,H=230;
  c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,W,H);
  const NX=46,NY=23,pad=8,cw=(W-2*pad)/NX,ch=(H-2*pad)/NY;
  ctx.fillStyle='#0b0f14';ctx.fillRect(pad,pad,W-2*pad,H-2*pad);
  const colFor=rank=>rank<=3?'#3fb950':rank<=6?'#d29922':'#f85149';
  const ROWJ={R1:2,R2:4,R3:6,R4:8,R5:10,R6:12,R7:14,R8:16,R9:18,R10:20};
  for(const d of p.results){
    const j=ROWJ[d.gap[0]], i=d.gap[1];
    const x=pad+i*cw,y=pad+(NY-1-j)*ch;
    ctx.fillStyle=colFor(d.rank); ctx.globalAlpha=0.85;
    ctx.fillRect(x,y,cw,ch); ctx.globalAlpha=1;
    ctx.fillStyle='#0b0f14';ctx.font='9px sans-serif';ctx.textAlign='center';
    ctx.fillText(d.rank,x+cw/2,y+ch/2+3);
  }
  let rows='';
  for(const d of p.results){
    rows+=`<tr><td>${d.rank}</td><td>${d.gap[0]}-${d.gap[1]}</td>
      <td class="mono">${d.local_rise.toFixed(1)}</td>
      <td class="mono">${d.max_delta.toFixed(1)}</td>
      <td class="mono">${d.energy_delta_kw.toFixed(1)}</td></tr>`;
  }
  $('#pltable').innerHTML=`<table><thead><tr><th>推荐</th><th>空位</th><th>周边升温°C</th><th>全场峰值升°C</th><th>新增冷负荷kW</th></tr></thead><tbody>${rows}</tbody></table>`;
}
loadSummary(); loadPlacement();
</script>
</body>
</html>
